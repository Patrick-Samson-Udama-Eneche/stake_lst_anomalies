# Conda alternative to the pip / uv install, for machines where the pip GDAL wheels fail.
# conda-forge provides Python and the GDAL stack, at the versions in requirements.lock;
# pip then installs everything else from the same lock, so both routes give one environment.
#
#   conda env create -f environment.yml      (or: mamba / micromamba create -f environment.yml)
#   conda activate stake_lst_anomalies
name: stake_lst_anomalies
channels:
  - conda-forge
dependencies:
  - python=3.12.10
  - pip
  - gdal
  - numpy=2.4.4
  - shapely=2.1.2
  - pyproj=3.7.2
  - pyogrio=0.12.1
  - fiona=1.10.1
  - rasterio=1.5.0
  - geopandas=1.1.3
  - pip:
      - -r requirements.lock
